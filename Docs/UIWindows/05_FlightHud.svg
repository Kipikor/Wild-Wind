      <line x1="600" y1="176" x2="1320" y2="176" class="line" />
      <text x="620" y="166" class="small" text-anchor="middle">330</text><text x="730" y="166" class="small" text-anchor="middle">345</text><text x="840" y="166" class="h2" text-anchor="middle">N</text><text x="950" y="166" class="small" text-anchor="middle">015</text><text x="1060" y="166" class="small" text-anchor="middle">030</text><text x="1170" y="166" class="small" text-anchor="middle">045</text><text x="1280" y="166" class="small" text-anchor="middle">060</text>
