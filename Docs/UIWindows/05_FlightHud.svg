      <g><rect x="76" y="744" width="420" height="58" class="row" rx="7"/><text x="92" y="768" class="txt" >Автопилот</text><text x="92" y="790" class="small" >цель из активной задачи</text><g><rect x="318" y="763" width="120" height="12" class="barBg" rx="6"/><rect x="320" y="765" width="92.80000000000001" height="8" class="green" rx="4"/><text x="450" y="775" class="small" >80%</text></g></g>
      <g><rect x="76" y="816" width="420" height="58" class="row" rx="7"/><text x="92" y="840" class="txt" >Стыковка</text><text x="92" y="862" class="small" >автостыковка включена</text><g><rect x="318" y="835" width="120" height="12" class="barBg" rx="6"/><rect x="320" y="837" width="69.6" height="8" class="blue" rx="4"/><text x="450" y="847" class="small" >60%</text></g></g>
      <g><rect x="76" y="888" width="420" height="58" class="row" rx="7"/><text x="92" y="912" class="txt" >Предупреждение</text><text x="92" y="934" class="small" >ветер боковой, компенсируется</text><g><rect x="318" y="907" width="120" height="12" class="barBg" rx="6"/><rect x="320" y="909" width="39.440000000000005" height="8" class="yellow" rx="4"/><text x="450" y="919" class="small" >34%</text></g></g>
    </g>
    <g class="shadow"><rect x="560" y="736" width="800" height="230" class="panel" rx="10"/><text x="584" y="778" class="h1" >Управление</text>
      <g><rect x="596" y="792" width="150" height="74" class="panelSoft" rx="8"/><text x="614" y="817" class="small" >ВЫСОТА</text><text x="614" y="849" class="num blue" >2550 м</text></g>
      <g><rect x="764" y="792" width="150" height="74" class="panelSoft" rx="8"/><text x="782" y="817" class="small" >ЦЕЛЬ</text><text x="782" y="849" class="num blue" >2600 м</text></g>
      <g><rect x="932" y="792" width="150" height="74" class="panelSoft" rx="8"/><text x="950" y="817" class="small" >СКОРОСТЬ</text><text x="950" y="849" class="num accent" >34 м/с</text></g>
      <g><rect x="1100" y="792" width="150" height="74" class="panelSoft" rx="8"/><text x="1118" y="817" class="small" >ТЯГА</text><text x="1118" y="849" class="num green" >3/5</text></g>
      <g><rect x="596" y="890" width="120" height="46" class="btn" rx="8"/><text x="656" y="921" class="buttonText" text-anchor="middle">←</text></g><g><rect x="724" y="890" width="120" height="46" class="btn" rx="8"/><text x="784" y="921" class="buttonText" text-anchor="middle">↑</text></g><g><rect x="852" y="890" width="120" height="46" class="btn" rx="8"/><text x="912" y="921" class="buttonText" text-anchor="middle">→</text></g>
      <g><rect x="1010" y="890" width="160" height="46" class="btn" rx="8"/><text x="1090" y="921" class="buttonText" text-anchor="middle">ФОРСАЖ</text></g><g><rect x="1184" y="890" width="140" height="46" class="btn" rx="8"/><text x="1254" y="921" class="buttonText" text-anchor="middle">МЕНЮ</text></g>
    </g>
    <g class="shadow"><rect x="1482" y="164" width="330" height="802" class="panel" rx="10"/><text x="1506" y="206" class="h1" >Мощность</text>
      <g><rect x="1524" y="236" width="226" height="12" class="barBg" rx="6"/><rect x="1526" y="238" width="168.72" height="8" class="green" rx="4"/><text x="1762" y="248" class="small" >двиг.</text></g>
      <g><rect x="1524" y="304" width="226" height="12" class="barBg" rx="6"/><rect x="1526" y="306" width="128.76" height="8" class="blue" rx="4"/><text x="1762" y="316" class="small" >контур</text></g>
      <g><rect x="1524" y="372" width="236" height="12" class="barBg" rx="6"/><rect x="1526" y="374" width="97.44" height="8" class="yellow" rx="4"/><text x="1772" y="384" class="small" >винт</text></g>
      <g><rect x="1524" y="460" width="248" height="58" class="row" rx="7"/><text x="1540" y="484" class="txt" >Высота</text><text x="1540" y="506" class="small" >Assist</text><g><rect x="1636" y="479" width="88" height="12" class="barBg" rx="6"/><rect x="1638" y="481" width="42" height="8" class="blue" rx="4"/><text x="1736" y="491" class="small" >50%</text></g></g>
      <g><rect x="1524" y="532" width="248" height="58" class="row" rx="7"/><text x="1540" y="556" class="txt" >Курс</text><text x="1540" y="578" class="small" >Autopilot</text><g><rect x="1636" y="551" width="88" height="12" class="barBg" rx="6"/><rect x="1638" y="553" width="79.8" height="8" class="green" rx="4"/><text x="1736" y="563" class="small" >95%</text></g></g>
      <g><rect x="1524" y="604" width="248" height="58" class="row" rx="7"/><text x="1540" y="628" class="txt" >Скорость</text><text x="1540" y="650" class="small" >Autopilot</text><g><rect x="1636" y="623" width="88" height="12" class="barBg" rx="6"/><rect x="1638" y="625" width="79.8" height="8" class="green" rx="4"/><text x="1736" y="635" class="small" >95%</text></g></g>
      <g><rect x="1524" y="862" width="248" height="58" class="btnPrimary" rx="8"/><text x="1648" y="899" class="buttonText" text-anchor="middle">СТЫКОВАТЬСЯ</text></g>
    </g>
</svg>
