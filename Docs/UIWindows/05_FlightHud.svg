    <rect class="shipDark" x="72" y="100" width="350" height="68" rx="22"/>
    <rect class="shipDark" x="160" y="36" width="140" height="58" rx="20"/>
    <line class="line" x1="30" y1="78" x2="520" y2="78"/>
    <circle class="lamp" cx="440" cy="106" r="7"/>
  </g></g>
    <g class="shadow">
