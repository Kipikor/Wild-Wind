<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg0 { fill: #18212a; }
      .cloud1 { fill: #d9c8aa; opacity: .24; }
      .cloud2 { fill: #f4dfb5; opacity: .18; }
      .island { fill: #30353a; }
      .rock { fill: #20252b; }
      .building { fill: #3d352b; stroke: #80613a; stroke-width: 2; }
      .roof { fill: #161c22; }
      .lamp { fill: #f2b45f; opacity: .88; }
      .ship { fill: #2d3440; stroke: #b68446; stroke-width: 2; }
      .ship2 { fill: #151a21; stroke: #775736; stroke-width: 2; }
      .panel { fill: #12100d; stroke: #8a6334; stroke-width: 2; }
      .panel2 { fill: #1b1711; stroke: #6e4d28; stroke-width: 1.5; }
      .panel3 { fill: #242018; stroke: #9b713b; stroke-width: 1.5; }
      .bar-bg { fill: #17140f; stroke: #5f4627; stroke-width: 1; }
      .gold { fill: #e5c17a; }
      .muted { fill: #a79369; }
      .soft { fill: #c7b084; }
      .green { fill: #7fbc48; }
      .yellow { fill: #dca94a; }
      .red { fill: #c85b42; }
      .blue { fill: #5db4d8; }
      .line { stroke: #8a6334; stroke-width: 2; }
      .title { font: 700 30px Georgia, 'Times New Roman', serif; fill: #f0d28c; letter-spacing: .5px; }
      .h1 { font: 700 24px Georgia, 'Times New Roman', serif; fill: #f0d28c; }
      .h2 { font: 700 18px Georgia, 'Times New Roman', serif; fill: #e5c17a; }
      .txt { font: 500 16px Inter, Arial, sans-serif; fill: #e2d3ad; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #a79369; }
      .micro { font: 500 11px Inter, Arial, sans-serif; fill: #a79369; }
      .num { font: 700 22px Inter, Arial, sans-serif; fill: #f0d28c; }
      .btn { fill: #241b10; stroke: #b47a38; stroke-width: 2; }
      .btn-primary { fill: #3a260f; stroke: #d79a43; stroke-width: 3; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#526b83"/>
      <stop offset=".52" stop-color="#d7b782"/>
      <stop offset="1" stop-color="#273747"/>
    </linearGradient>
    <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4054" stop-opacity=".05"/>
      <stop offset="1" stop-color="#091016" stop-opacity=".82"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#storm)"/>

  <!-- Sky, city and dock backdrop -->
  <g>
    <ellipse class="cloud2" cx="370" cy="250" rx="330" ry="105"/>
