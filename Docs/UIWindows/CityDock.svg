    <rect class="building" x="950" y="330" width="118" height="210"/>
    <rect class="roof" x="932" y="300" width="154" height="34"/>
    <rect class="building" x="1110" y="370" width="96" height="168"/>
    <rect class="roof" x="1092" y="344" width="132" height="30"/>
    <rect class="building" x="1240" y="410" width="120" height="126"/>
