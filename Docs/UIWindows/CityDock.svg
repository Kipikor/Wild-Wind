    </g>
    <g transform="translate(1542 704)">
      <text class="txt" x="42" y="18">Больница ур. II</text><rect class="bar-bg" x="42" y="34" width="250" height="13"/><rect class="green" x="44" y="36" width="180" height="9"/><text class="small" x="306" y="47">72%</text><text class="small" x="42" y="69">осталось 01:15:42</text><text class="h2" x="0" y="43">✚</text>
