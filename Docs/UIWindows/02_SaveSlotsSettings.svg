<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .topBar,.panel{fill:#12100d;stroke:#8a6334;stroke-width:2}
      .panelSoft,.row{fill:#1b1711;stroke:#5f4627;stroke-width:1.4}
      .row{fill:#181d20}
      .navItem{fill:#17140f;stroke:#5f4627;stroke-width:1.4}
      .navActive{fill:#33230f;stroke:#d79a43;stroke-width:2.2}
      .btn{fill:#241b10;stroke:#b47a38;stroke-width:2}
      .btnPrimary{fill:#3a260f;stroke:#d79a43;stroke-width:3}
      .chip{fill:#24302a;stroke:#789c63;stroke-width:1.3}
      .chipBlue{fill:#1d2c35;stroke:#5db4d8;stroke-width:1.3}
      .chipWarn{fill:#3a241d;stroke:#c85b42;stroke-width:1.3}
      .barBg{fill:#17140f;stroke:#5f4627;stroke-width:1}
      .green{fill:#7fbc48}.gold,.accent{fill:#e5c17a}.blue{fill:#5db4d8}.rust{fill:#c85b42}.yellow{fill:#dca94a}.red{fill:#c85b42}
      .cloud{fill:#f4dfb5;opacity:.18}.cloud2{fill:#d9c8aa;opacity:.24}
      .rock{fill:#20252b}.island{fill:#30353a;stroke:#80613a;stroke-width:2}
      .ship{fill:#2d3440;stroke:#b68446;stroke-width:2}.shipDark{fill:#151a21;stroke:#775736;stroke-width:2}
      .lamp{fill:#f2b45f;opacity:.88}
      .line{stroke:#8a6334;stroke-width:2}.route{stroke:#d79a43;stroke-width:4;fill:none;stroke-dasharray:12 10}.routeDim{opacity:.4}
      .grid{stroke:#6f7f82;stroke-width:1;opacity:.09}
      .title{font:700 30px Georgia,'Times New Roman',serif;fill:#f0d28c}
      .h1{font:700 24px Georgia,'Times New Roman',serif;fill:#f0d28c}
      .h2{font:700 18px Inter,Arial,sans-serif;fill:#e5c17a}
      .txt{font:500 16px Inter,Arial,sans-serif;fill:#e2d3ad}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#a79369}
      .micro{font:500 11px Inter,Arial,sans-serif;fill:#a79369}
      .num{font:700 22px Inter,Arial,sans-serif;fill:#f0d28c}
      .buttonText{font:700 15px Inter,Arial,sans-serif;fill:#e5c17a}
      .buttonTextBig{font:700 30px Georgia,'Times New Roman',serif;fill:#f0d28c}
      .navText{font:700 15px Inter,Arial,sans-serif;fill:#e5c17a}
      .chipText{font:700 13px Inter,Arial,sans-serif;fill:#d9e3cf}
      .mapLabel{font:700 16px Inter,Arial,sans-serif;fill:#f0d28c}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#526b83"/><stop offset=".52" stop-color="#d7b782"/><stop offset="1" stop-color="#273747"/>
    </linearGradient>
    <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4054" stop-opacity=".05"/><stop offset="1" stop-color="#091016" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4c56" stop-opacity=".35"/><stop offset="1" stop-color="#090b0e" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#121923"/>
    <rect width="1920" height="1080" fill="url(#gridFade)"/>
    <line x1="0" y1="120" x2="1920" y2="120" class="grid" /><line x1="0" y1="170" x2="1920" y2="170" class="grid" /><line x1="0" y1="220" x2="1920" y2="220" class="grid" /><line x1="0" y1="270" x2="1920" y2="270" class="grid" /><line x1="0" y1="320" x2="1920" y2="320" class="grid" /><line x1="0" y1="370" x2="1920" y2="370" class="grid" /><line x1="0" y1="420" x2="1920" y2="420" class="grid" /><line x1="0" y1="470" x2="1920" y2="470" class="grid" /><line x1="0" y1="520" x2="1920" y2="520" class="grid" /><line x1="0" y1="570" x2="1920" y2="570" class="grid" /><line x1="0" y1="620" x2="1920" y2="620" class="grid" /><line x1="0" y1="670" x2="1920" y2="670" class="grid" /><line x1="0" y1="720" x2="1920" y2="720" class="grid" /><line x1="0" y1="770" x2="1920" y2="770" class="grid" /><line x1="0" y1="820" x2="1920" y2="820" class="grid" /><line x1="0" y1="870" x2="1920" y2="870" class="grid" /><line x1="0" y1="920" x2="1920" y2="920" class="grid" /><line x1="0" y1="970" x2="1920" y2="970" class="grid" /><line x1="0" y1="1020" x2="1920" y2="1020" class="grid" />
    <line x1="60" y1="0" x2="60" y2="1080" class="grid" /><line x1="156" y1="0" x2="156" y2="1080" class="grid" /><line x1="252" y1="0" x2="252" y2="1080" class="grid" /><line x1="348" y1="0" x2="348" y2="1080" class="grid" /><line x1="444" y1="0" x2="444" y2="1080" class="grid" /><line x1="540" y1="0" x2="540" y2="1080" class="grid" /><line x1="636" y1="0" x2="636" y2="1080" class="grid" /><line x1="732" y1="0" x2="732" y2="1080" class="grid" /><line x1="828" y1="0" x2="828" y2="1080" class="grid" /><line x1="924" y1="0" x2="924" y2="1080" class="grid" /><line x1="1020" y1="0" x2="1020" y2="1080" class="grid" /><line x1="1116" y1="0" x2="1116" y2="1080" class="grid" /><line x1="1212" y1="0" x2="1212" y2="1080" class="grid" /><line x1="1308" y1="0" x2="1308" y2="1080" class="grid" /><line x1="1404" y1="0" x2="1404" y2="1080" class="grid" /><line x1="1500" y1="0" x2="1500" y2="1080" class="grid" /><line x1="1596" y1="0" x2="1596" y2="1080" class="grid" /><line x1="1692" y1="0" x2="1692" y2="1080" class="grid" /><line x1="1788" y1="0" x2="1788" y2="1080" class="grid" /><line x1="1884" y1="0" x2="1884" y2="1080" class="grid" /><g class="shadow">
    <rect x="24" y="20" width="1872" height="74" class="topBar" rx="10"/>
    <text x="54" y="58" class="title" >СОХРАНЕНИЯ И НАСТРОЙКИ</text>
    <text x="54" y="82" class="small" >слоты мира, язык, управление, звук</text>
    <text x="1540" y="58" class="h2" text-anchor="end">меню</text>
    <g><rect x="1574" y="31" width="156" height="52" class="btn" rx="8"/><text x="1652" y="65" class="buttonText" text-anchor="middle">СОХРАНИТЬ</text></g>
    <g><rect x="1744" y="31" width="62" height="52" class="btn" rx="8"/><text x="1775" y="65" class="buttonText" text-anchor="middle">⚙</text></g>
  </g>
    <g class="shadow"><rect x="84" y="128" width="760" height="812" class="panel" rx="10"/><text x="108" y="170" class="h1" >Продолжить</text>
      <g><rect x="122" y="194" width="686" height="58" class="row" rx="7"/><text x="138" y="218" class="txt" >Слот 1 · Столица</text><text x="138" y="240" class="small" >день 163, Пионер, доковый режим</text><g><rect x="630" y="213" width="120" height="12" class="barBg" rx="6"/><rect x="632" y="215" width="106.72" height="8" class="green" rx="4"/><text x="762" y="225" class="small" >92%</text></g></g>
      <g><rect x="122" y="274" width="686" height="58" class="row" rx="7"/><text x="138" y="298" class="txt" >Слот 2 · Аэролитовый остров</text><text x="138" y="320" class="small" >день 41, доставка еды завершена</text><g><rect x="630" y="293" width="120" height="12" class="barBg" rx="6"/><rect x="632" y="295" width="62.64" height="8" class="blue" rx="4"/><text x="762" y="305" class="small" >54%</text></g></g>
      <g><rect x="122" y="354" width="686" height="58" class="row" rx="7"/><text x="138" y="378" class="txt" >Слот 3 · пусто</text><text x="138" y="400" class="small" >новая история</text><g><rect x="630" y="373" width="120" height="12" class="barBg" rx="6"/><rect x="632" y="375" width="6.96" height="8" class="rust" rx="4"/><text x="762" y="385" class="small" >6%</text></g></g>
      <g><rect x="122" y="808" width="220" height="58" class="btn" rx="8"/><text x="232" y="845" class="buttonText" text-anchor="middle">НАЗАД</text></g>
      <g><rect x="588" y="808" width="220" height="58" class="btnPrimary" rx="8"/><text x="698" y="845" class="buttonText" text-anchor="middle">ЗАГРУЗИТЬ</text></g>
    </g>
    <g class="shadow"><rect x="900" y="128" width="936" height="812" class="panel" rx="10"/><text x="924" y="170" class="h1" >Настройки</text>
      <g><rect x="938" y="194" width="820" height="58" class="row" rx="7"/><text x="954" y="218" class="txt" >Язык</text><text x="954" y="240" class="small" >Русский / English</text><g><rect x="1580" y="213" width="120" height="12" class="barBg" rx="6"/><rect x="1582" y="215" width="58" height="8" class="blue" rx="4"/><text x="1712" y="225" class="small" >50%</text></g></g>
      <g><rect x="938" y="274" width="820" height="58" class="row" rx="7"/><text x="954" y="298" class="txt" >Громкость музыки</text><text x="954" y="320" class="small" >спокойная тема дока</text><g><rect x="1580" y="293" width="120" height="12" class="barBg" rx="6"/><rect x="1582" y="295" width="78.88000000000001" height="8" class="green" rx="4"/><text x="1712" y="305" class="small" >68%</text></g></g>
      <g><rect x="938" y="354" width="820" height="58" class="row" rx="7"/><text x="954" y="378" class="txt" >Громкость мира</text><text x="954" y="400" class="small" >ветер, двигатели, док</text><g><rect x="1580" y="373" width="120" height="12" class="barBg" rx="6"/><rect x="1582" y="375" width="85.84" height="8" class="green" rx="4"/><text x="1712" y="385" class="small" >74%</text></g></g>
      <g><rect x="938" y="434" width="820" height="58" class="row" rx="7"/><text x="954" y="458" class="txt" >Управление</text><text x="954" y="480" class="small" >WASD, Q/E высота, ПКМ орбита, колесо зум</text><g><rect x="1580" y="453" width="120" height="12" class="barBg" rx="6"/><rect x="1582" y="455" width="95.11999999999999" height="8" class="yellow" rx="4"/><text x="1712" y="465" class="small" >82%</text></g></g>
      <g><rect x="938" y="514" width="820" height="58" class="row" rx="7"/><text x="954" y="538" class="txt" >Автосохранение при стыковке</text><text x="954" y="560" class="small" >включено</text><g><rect x="1580" y="533" width="120" height="12" class="barBg" rx="6"/><rect x="1582" y="535" width="110.19999999999999" height="8" class="green" rx="4"/><text x="1712" y="545" class="small" >95%</text></g></g>
      <g><rect x="938" y="808" width="220" height="58" class="btn" rx="8"/><text x="1048" y="845" class="buttonText" text-anchor="middle">СБРОСИТЬ</text></g>
      <g><rect x="1538" y="808" width="220" height="58" class="btnPrimary" rx="8"/><text x="1648" y="845" class="buttonText" text-anchor="middle">ПРИМЕНИТЬ</text></g>
    </g>
</svg>
